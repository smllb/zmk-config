# Configure this as peripheral (right side of split keyboard)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Specify this is the right side of the split keyboard
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Enable keyboard output from peripheral
CONFIG_ZMK_USB=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
