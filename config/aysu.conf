# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Increase the Bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# Enable USB on both halves
CONFIG_ZMK_USB=y

# Improve split connection reliability
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# More aggressive split keyboard sync
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=8
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# Set bluetooth name
CONFIG_ZMK_KEYBOARD_NAME="aysú"

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
